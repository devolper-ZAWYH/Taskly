[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskly-live-engine"
version = "0.1.0"
description = "Taskly Live Meetings capture engine (Python prototype): mic + system loopback capture, VAD, faster-whisper STT, journal + idempotent pusher against the Taskly /api/live contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Taskly" }]
dependencies = [
    "numpy>=1.26",
    "requests>=2.31",
    "sounddevice>=0.4.6",
    "PyAudioWPatch>=0.2.12.6; sys_platform == 'win32'",
    "sentencepiece>=0.2",
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
taskly-live = "taskly_live.cli:main"

[tool.setuptools]
packages = ["taskly_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
